<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Madarkaci Model School Management System</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        :root {
            --primary: #20795d;
            --secondary: #285f9d;
            --dark: #182433;
            --light: #f3f6f8;
            --white: #ffffff;
            --gold: #bd7d18;
            --red: #b33d3a;
            --line: #d8e0e8;
            --shadow: 0 12px 28px rgba(23, 36, 51, .08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, var(--light) 0%, #e6edf2 100%);
            min-height: 100vh;
            display: grid;
            place-items: center;
        }
        .login-container {
            background: var(--white);
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            max-width: 420px;
            width: 100%;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: var(--white);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border: 3px solid var(--primary);
            overflow: hidden;
        }
        .logo img { width: 60px; }
        h1 { 
            margin: 0; 
            font-size: 1.8em; 
            color: var(--dark);
            text-align: center;
        }
        h2 { 
            margin: 5px 0 25px; 
            font-size: 1em; 
            color: #666;
            font-weight: normal;
            text-align: center;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            color: var(--dark);
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .form-group input, .form-group select {
            width: 100%;
            min-height: 45px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 15px;
            background: #fff;
            color: var(--dark);
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(32, 121, 93, 0.2);
        }
        .btn {
            width: 100%;
            min-height: 45px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .btn:hover { background: #1a654d; transform: translateY(-2px); }
        .btn-secondary {
            background: #e7edf3;
            color: var(--dark);
            margin-top: 12px;
        }
        .hint {
            background: #fff8e6;
            border-left: 4px solid var(--gold);
            padding: 15px;
            margin-top: 25px;
            font-size: 13px;
            color: var(--dark);
            border-radius: 0 8px 8px 0;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link a:hover { text-decoration: underline; }
        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            background: var(--dark);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            z-index: 1000;
            display: none;
        }
        .toast.show { display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="assets/mms-logo.jpg" alt="MMS Logo">
        </div>
        <h1>Madarkaci Model School</h1>
        <h2>School Management System Login</h2>
        
        <div class="form-group">
            <label for="loginRole">Login Type</label>
            <select id="loginRole">
                <option value="Administrator">Administrator</option>
                <option value="Teacher">Teacher</option>
                <option value="Accountant">Accountant</option>
                <option value="Exam Officer">Exam Officer</option>
                <option value="Parent">Parent</option>
                <option value="Student">Student</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="loginUsername">Username / ID / Phone</label>
            <input type="text" id="loginUsername" placeholder="Enter your ID, username or phone number">
        </div>
        
        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password">
        </div>
        
        <button class="btn" onclick="login()">Login →</button>
        <button class="btn btn-secondary" onclick="recoverPassword()">Reset / Recover Password</button>
        
        <div class="hint">
            <strong>Demo Credentials:</strong><br>
            <code style="display: block; margin: 8px 0;">Administrator: admin / admin123</code>
            <code style="display: block; margin: 8px 0;">Teacher: MMS/STF/001 / teacher</code>
            <code style="display: block; margin: 8px 0;">Accountant: accountant / account123</code>
            <code style="display: block; margin: 8px 0;">Student: MMS/2026/001 / student123</code>
        </div>
        
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>
    
    <script>
        const API_URL = "/api/db";
        let currentUser = null;
        
        const seed = {
          settings: {
            schoolName: "Madarkaci Model School",
            address: "NO. 103 ALIYU ROAD, MADARKACI, OPP. INSTITUTE OF CHILD HEALTH, A.B.U-TIH ZARIA - KADUNA STATE",
            email: "madarkacimodelschools@gmail.com",
            phone: "",
            session: "2025/2026",
            term: "First Term",
            daysOpen: 65,
            nextTermBegins: "2026-01-12",
            principalComment: "Approved. More effort is encouraged."
          },
          users: [
            { id: "u1", username: "admin", password: "admin123", role: "Administrator" },
            { id: "u2", username: "teacher", password: "teacher", role: "Teacher" },
            { id: "u3", username: "accountant", password: "account123", role: "Accountant" },
            { id: "u4", username: "parent", password: "parent123", role: "Parent" },
            { id: "u5", username: "student", password: "student123", role: "Student" },
            { id: "u6", username: "exam_officer", password: "exam123", role: "Exam Officer" }
          ],
          classes: [
            { id: "c1", name: "Nursery 1", section: "Nursery", teacherId: "s1" },
            { id: "c2", name: "Primary 1", section: "Primary", teacherId: "s2" },
            { id: "c3", name: "JSS 1 (Basic 7)", section: "Junior Secondary", teacherId: "s1" },
            { id: "c4", name: "SS 1", section: "Senior Secondary", teacherId: "s3" },
          ],
          subjects: [
            { id: "sub1", name: "Numeracy", code: "NUM", classId: "c3", teacherId: "s1" },
            { id: "sub2", name: "Literacy", code: "LIT", classId: "c3", teacherId: "s1" },
            { id: "sub3", name: "Islamic Religious Studies", code: "IRS", classId: "c3", teacherId: "s2" },
            { id: "sub4", name: "Hausa Language", code: "HAU", classId: "c3", teacherId: "s2" },
          ],
          staff: [
            { id: "s1", staffNo: "MMS/STF/001", firstName: "Amina", middleName: "", lastName: "Yusuf", role: "Teacher", phone: "08010000001", subjectIds: ["sub1", "sub2"] },
            { id: "s2", staffNo: "MMS/STF/002", firstName: "Kabiru", middleName: "Muhammad", lastName: "Sani", role: "Teacher", phone: "08010000002", subjectIds: ["sub3", "sub4"] },
            { id: "s3", staffNo: "MMS/STF/003", firstName: "Maryam", middleName: "", lastName: "Ali", role: "Accountant", phone: "08010000003", subjectIds: [] }
          ],
          students: [
            { id: "st1", regNo: "MMS/2026/001", firstName: "Aisha", middleName: "", lastName: "Abdullahi", gender: "Female", classId: "c3", parentPhone: "08000000001" },
          ]
        };
        
        let db = seed;
        
        function fullName(staff) { return [staff.firstName, staff.middleName, staff.lastName].filter(Boolean).join(" ").trim(); }
        
        function toast(message) {
            const el = document.getElementById("toast");
            el.textContent = message;
            el.classList.add("show");
            setTimeout(() => el.classList.remove("show"), 2200);
        }
        
        async function load() {
            try {
                const response = await fetch(API_URL);
                if (response.ok) db = await response.json();
            } catch (err) {
                console.error("Using local seed data", err);
            }
        }
        
        function login() {
            const role = document.getElementById("loginRole").value;
            const username = document.getElementById("loginUsername").value.trim();
            const password = document.getElementById("loginPassword").value;

            if (!username || !password) {
                return toast("Username da password ya kamata a sanya.");
            }

            let user = db.users.find((item) => item.username === username && item.password === password && item.role === role);

            if (!user && role === "Student") {
                const studentRecord = db.students.find((s) => s.regNo === username || s.firstName.toLowerCase() === username.toLowerCase());
                if (studentRecord && password === "student123") {
                    user = { id: studentRecord.id, username: studentRecord.regNo, password, role: "Student", studentId: studentRecord.id };
                }
            }

            if (!user && role === "Parent") {
                const studentRecord = db.students.find((s) => s.parentPhone === username);
                if (studentRecord && password === "parent123") {
                    user = { id: studentRecord.id, username: studentRecord.parentPhone, password, role: "Parent", studentId: studentRecord.id };
                }
            }

            if (!user && role === "Teacher") {
                const staffRecord = db.staff.find((s) => s.staffNo === username || (s.firstName.toLowerCase() === username.toLowerCase() && s.role === "Teacher"));
                if (staffRecord && password === "teacher") {
                    user = { id: staffRecord.id, username: fullName(staffRecord), password, role: "Teacher", staffId: staffRecord.id };
                }
            }

            if (!user) return toast("Login failed. Check username, password, and login type.");
            
            // Store user in localStorage and redirect to main system
            localStorage.setItem("mms_user", JSON.stringify(user));
            toast("Login successful! redirecting...");
            setTimeout(() => {
                window.location.href = "madarkaci_school_management.html";
            }, 1000);
        }
        
        function recoverPassword() {
            const username = document.getElementById("loginUsername").value.trim();
            if (!username) return toast("Enter username to recover password");
            const user = db.users.find((item) => item.username === username);
            if (user) {
                toast(`Recovery hint: password is ${user.password}`);
            } else {
                toast("User not found");
            }
        }
        
        // Check for pre-selected role from URL
        const urlParams = new URLSearchParams(window.location.search);
        const preselectedRole = urlParams.get('role');
        if (preselectedRole && document.getElementById("loginRole")) {
            document.getElementById("loginRole").value = preselectedRole;
        }
        
        load();
    </script>
</body>
</html>
