<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Madarkaci Model School</title>
  <link rel="icon" href="assets/mms-logo.jpg" type="image/jpeg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="bg-overlay"></div>

  <!-- Top Header -->
  <header class="top-header">
    <img src="assets/mms-logo.jpg" alt="Madarkaci Model School Logo" class="header-logo">
    <div class="header-info">
      <span class="header-school">Madarkaci Model School</span>
      <span class="header-system">School Management System</span>
    </div>
    <div class="header-meta">
      <span>2026/2027</span>
      <span>First Term</span>
      <span class="badge">Days Open: 65</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="glass-card">

      <!-- Logo -->
      <div class="card-logo">
        <img src="assets/mms-logo.jpg" alt="School Logo">
      </div>

      <!-- Header -->
      <div class="card-header">
        <h2>Welcome Back</h2>
        <p>Sign in to access your dashboard</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="return false;" autocomplete="off">
        <div class="form-group">
          <label for="loginRole">Login Type</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-user-shield"></i></span>
            <select id="loginRole">
              <option>Administrator</option>
              <option>Teacher</option>
              <option>Accountant</option>
              <option>Exam Officer</option>
              <option>Parent</option>
              <option>Student</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="loginUsername">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
            <input id="loginUsername" value="admin" placeholder="Enter your username">
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input id="loginPassword" type="password" value="admin123" placeholder="Enter your password">
          </div>
        </div>

        <button class="signin-btn" type="button" onclick="doLogin()" id="signinBtn">
          <span class="btn-text">Sign In</span>
          <span class="spinner"></span>
          <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </form>

      <a href="#" class="forgot-link" onclick="recoverPassword(); return false;">Forgot Password?</a>

      <!-- Demo Credentials -->
      <div class="demo-box">
        <div class="demo-title">Demo Credentials</div>
        <div class="demo-creds">
          <strong>admin / admin123</strong> &nbsp;|&nbsp;
          <strong>teacher / teacher</strong> &nbsp;|&nbsp;
          <strong>accountant / account123</strong>
        </div>
      </div>

    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="js/login.js"></script>
</body>
</html>
